# Label taxonomy resmi UAI AI Research Center (dokumen sumber §R).
# Sinkronkan ke repo dengan workflow .github/workflows/sync-labels.yml (manual dispatch)
# atau alat seperti `github-label-sync`. Jangan membuat label di luar taksonomi ini
# tanpa memperbarui file ini terlebih dahulu.

# ---- Type: jenis unit riset (Issue sebagai unit penelitian) ----
- name: "type:problem"
  color: "0e8a16"
  description: "Research Problem — masalah apa yang layak diteliti"
- name: "type:research-question"
  color: "1d76db"
  description: "Research Question — pertanyaan/hipotesis yang perlu diuji"
- name: "type:dataset"
  color: "fbca04"
  description: "Dataset — data yang tersedia/dibutuhkan"
- name: "type:experiment"
  color: "d93f0b"
  description: "Experiment — eksperimen/pilot yang dijalankan"
- name: "type:literature-gap"
  color: "5319e7"
  description: "Literature Gap — gap yang teridentifikasi dari evidence map"
- name: "type:publication"
  color: "b60205"
  description: "Publication — naskah yang sedang disiapkan"
- name: "type:artifact"
  color: "006b75"
  description: "Artifact — software/model/benchmark/prototype"
- name: "type:research-risk"
  color: "e99695"
  description: "Research Risk — bottleneck atau risiko riset"
- name: "type:bug"
  color: "ededed"
  description: "Bug — kesalahan pada kode/dokumen/template"

# ---- Gate: posisi riset pada 8 Research Gates (OPS-03) ----
- name: "gate:G1-endgame"
  color: "c2e0c6"
  description: "G1 Endgame Ready"
- name: "gate:G2-problem"
  color: "a2d2a6"
  description: "G2 Problem Ready"
- name: "gate:G3-evidence"
  color: "82c486"
  description: "G3 Evidence Ready"
- name: "gate:G4-question"
  color: "62b666"
  description: "G4 Question Ready"
- name: "gate:G5-method"
  color: "42a846"
  description: "G5 Method Ready"
- name: "gate:G6-experiment"
  color: "2f9a33"
  description: "G6 Experiment Ready"
- name: "gate:G7-claim"
  color: "1f7d23"
  description: "G7 Claim Ready"
- name: "gate:G8-contribution"
  color: "0f5f13"
  description: "G8 Contribution Ready"

# ---- Cluster: 4 klaster riset AI (AIR-02) ----
- name: "cluster:models"
  color: "0052cc"
  description: "C1 AI Models, Data & Knowledge"
- name: "cluster:systems"
  color: "0e8a8a"
  description: "C2 AI Systems, Software & Security"
- name: "cluster:human-ai"
  color: "8a2be2"
  description: "C3 Human-Centered & Responsible AI"
- name: "cluster:applied"
  color: "c5620f"
  description: "C4 Applied AI for Human Flourishing"

# ---- Priority ----
- name: "P0-critical"
  color: "b60205"
  description: "Kritis — memblokir riset/gate lain"
- name: "P1-high"
  color: "d93f0b"
  description: "Tinggi"
- name: "P2-medium"
  color: "fbca04"
  description: "Sedang"
- name: "P3-low"
  color: "c2e0c6"
  description: "Rendah"

# ---- Status ----
- name: "status:blocked"
  color: "000000"
  description: "Terblokir oleh dependensi/keputusan lain"
- name: "status:review"
  color: "5319e7"
  description: "Menunggu review (gate review / peer review)"
- name: "status:ready"
  color: "0e8a16"
  description: "Siap dikerjakan"

# ---- Maturity (opsional, untuk backlog & Mission Control) ----
- name: "maturity:idea"
  color: "f9d0c4"
  description: "Idea — belum divalidasi"
- name: "maturity:ta-ready"
  color: "fef2c0"
  description: "TA Ready"
- name: "maturity:research-ready"
  color: "c2e0c6"
  description: "Research Ready"
- name: "maturity:publication-ready"
  color: "bfdadc"
  description: "Publication Ready"
- name: "maturity:impact-ready"
  color: "d4c5f9"
  description: "Impact Ready"
